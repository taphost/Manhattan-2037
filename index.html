<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manhattan — Night Vision 2037</title>

  <!-- ═══════════════════════════════════════════════════════════
       STYLES
       ═══════════════════════════════════════════════════════════ -->
  <style>
    @font-face {
      font-family: 'VCROSDMono';
      src: url('fonts/VCROSDMono.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #010302;
      font-family: 'VCROSDMono', 'Courier New', monospace;
    }

    /* ── CRT scanline overlay (CSS only, zero GPU cost) ── */
    #crt {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent           0px,
        transparent           2px,
        rgba(0, 0, 0, 0.07)   2px,
        rgba(0, 0, 0, 0.07)   4px
      );
    }

    /* ── HUD: top-left terminal overlay ── */
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      display: none;             /* shown by JS when loading starts */
      font-size: clamp(11px, 1.8vw, 14px);
      line-height: 2.0;
      color: #4cff7a;
      pointer-events: none;
      animation: flicker 4s infinite;
    }

    .hrow { display: flex; gap: 12px; }

    /* dim label column */
    .hlbl {
      color: #4cff7a99;
      min-width: 80px;
      letter-spacing: 1px;
    }

    /* bright value column with phosphor glow */
    .hval {
      color: #7dffb0;
      text-shadow:
        0 0  6px #4cff7a,
        0 0 14px #4cff7a88,
        0 0 28px #4cff7a44;
    }

    /* typewriter caret */
    .cur {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: #4cff7a;
      vertical-align: text-bottom;
      animation: blink .55s step-end infinite;
    }

    /* ── Keyframe animations ── */
    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1;    }
      92%       { opacity: 1;    }
      93%       { opacity: 0.82; }
      94%       { opacity: 1;    }
      96%       { opacity: 0.75; }
      97%       { opacity: 1;    }
    }
  </style>

  <!-- ═══════════════════════════════════════════════════════════
       THREE.JS IMPORT MAP  (no build tool needed)
       ═══════════════════════════════════════════════════════════ -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.183.2/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.183.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- CRT overlay -->
  <div id="crt"></div>

  <!-- HUD rows — labels and values are filled by the typewriter -->
  <div id="hud">
    <div class="hrow"><span class="hlbl" id="lbl0"></span><span class="hval" id="val0"></span></div>
    <div class="hrow"><span class="hlbl" id="lbl1"></span><span class="hval" id="val1"></span></div>
    <div class="hrow"><span class="hlbl" id="lbl2"></span><span class="hval" id="val2"></span></div>
    <div class="hrow"><span class="hlbl" id="lbl3"></span><span class="hval" id="val3"></span></div>
    <div class="hrow"><span class="hlbl" id="lbl4"></span><span class="hval" id="val4"></span></div>
  </div>

<!-- ═══════════════════════════════════════════════════════════════
     MAIN SCRIPT
     ═══════════════════════════════════════════════════════════════ -->
<script type="module">

  import * as THREE               from 'three';
  import { OrbitControls }        from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader }           from 'three/addons/loaders/GLTFLoader.js';
  import { LineSegments2 }        from 'three/addons/lines/LineSegments2.js';
  import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
  import { LineMaterial }         from 'three/addons/lines/LineMaterial.js';


  /* ─────────────────────────────────────────────────────────────
     CONSTANTS
  ───────────────────────────────────────────────────────────── */

  /** Detect mobile/low-power devices to reduce quality budget. */
  const IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
                 || innerWidth < 768;

  /** Night-vision green palette. */
  const COLOR_GREEN = 0x4cff7a;
  const COLOR_BG    = 0x010302;

  /** Target frame interval for the 25 fps cap. */
  const FRAME_MS = 1000 / 25;

  /** Model path — expects NYC/scene.gltf + NYC/scene.bin next to this file. */
  const MODEL_PATH = 'NYC/scene.gltf';

  /**
   * Panorama keyframes.
   * Each row: [ angleDeg, distMult, heightMult, lookYMult, durationSec ]
   * Distance/height values are multiplied by cityMaxDim at runtime
   * so the tour scales correctly regardless of model units.
   */
  const KF_TEMPLATES = [
    [  20,  1.4,  0.55,  0.10,  9 ],  // wide establishing shot
    [  80,  0.7,  0.18,  0.05, 10 ],  // low east-side flyby
    [ 150,  1.1,  0.70,  0.15,  9 ],  // high north angle
    [ 210,  0.5,  0.12, -0.02, 10 ],  // very low south approach
    [ 280,  0.9,  0.40,  0.08,  9 ],  // west-side mid height
    [ 340,  1.6,  0.80,  0.20,  8 ],  // far overview
    [ 380,  0.6,  0.22,  0.04, 10 ],  // close north sweep
  ];

  /** HUD boot-sequence lines typed out by the typewriter. */
  const HUD_LINES = [
    { lbl: 'SYSTEM  ', val: 'NV-RECON  v4.1.0'        },
    { lbl: 'LOCATION', val: '40.7831 N   73.9712 W'    },
    { lbl: 'CITY    ', val: 'NEW YORK'                  },
    { lbl: 'YEAR    ', val: '2037'                      },
    { lbl: 'STATUS  ', val: 'INITIALIZING...'           },
  ];


  /* ─────────────────────────────────────────────────────────────
     RENDERER
  ───────────────────────────────────────────────────────────── */

  const renderer = new THREE.WebGLRenderer({
    antialias:       !IS_MOBILE,   // MSAA off on mobile (costly with additive blending)
    powerPreference: 'high-performance',
  });

  renderer.setPixelRatio(IS_MOBILE ? 1 : Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.domElement.style.display = 'none';  // revealed after GLTF is parsed
  document.body.appendChild(renderer.domElement);


  /* ─────────────────────────────────────────────────────────────
     SCENE  /  CAMERA  /  CONTROLS
  ───────────────────────────────────────────────────────────── */

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(COLOR_BG);
  scene.fog        = new THREE.FogExp2(COLOR_BG, 0.06);  // density updated after load

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.001, 500);
  camera.position.set(0, 6, 14);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping  = true;
  controls.dampingFactor  = 0.08;
  controls.minDistance    = 0.5;
  controls.maxDistance    = 80;
  controls.maxPolarAngle  = Math.PI * 0.48;
  controls.enabled        = false;  // autopilot owns the camera until user taps


  /* ─────────────────────────────────────────────────────────────
     LIGHTS  /  GROUND PLANE
  ───────────────────────────────────────────────────────────── */

  scene.add(new THREE.AmbientLight(COLOR_GREEN, 0.02));

  const sun = new THREE.DirectionalLight(COLOR_GREEN, 0.12);
  sun.position.set(5, 8, 4);
  scene.add(sun);

  // Dark plane that hides the model underside and horizon
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 600),
    new THREE.MeshBasicMaterial({ color: COLOR_BG }),
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2;
  scene.add(ground);


  /* ─────────────────────────────────────────────────────────────
     NIGHT-VISION MATERIALS

     Two LineMaterial layers are composited per edge set:
       mCore — thin bright line  (4 px desktop / 3 px mobile)
       mHalo — wide dim glow     (10 px desktop / 5 px mobile)
     Both use AdditiveBlending to simulate CRT phosphor bloom.
  ───────────────────────────────────────────────────────────── */

  /** Shared resolution uniform — must be updated on window resize. */
  const RES = new THREE.Vector2(innerWidth, innerHeight);

  /** Opaque near-black material — buildings appear as solid dark forms. */
  const matDark = new THREE.MeshPhongMaterial({
    color:     0x010101,
    emissive:  0x000300,
    shininess: 0,
  });

  /**
   * Create a LineMaterial with additive blending.
   * @param {number} linewidth  Pixel width of the line.
   * @param {number} opacity    0–1 opacity.
   */
  function makeLineMat(linewidth, opacity) {
    return new LineMaterial({
      color:       COLOR_GREEN,
      linewidth,
      transparent: true,
      opacity,
      blending:    THREE.AdditiveBlending,
      depthWrite:  false,
      resolution:  RES,
    });
  }

  const mCore = makeLineMat(IS_MOBILE ? 3 : 4,  IS_MOBILE ? 0.88 : 0.92);
  const mHalo = makeLineMat(IS_MOBILE ? 5 : 10, IS_MOBILE ? 0.08 : 0.18);


  /* ─────────────────────────────────────────────────────────────
     LOD SYSTEM

     Each mesh produces 2 (desktop) or 3 (mobile) EdgesGeometry
     instances at different crease angle thresholds.
     Only the correct level is visible based on camera distance,
     reducing GPU fill-rate when zoomed out.

       full   — crease 20° — full detail, shown when close
       coarse — crease 50° — reduced segments, medium distance
       sil    — crease 70° — silhouette only, mobile far range
  ───────────────────────────────────────────────────────────── */

  /** Array of { full, coarse, sil, center } — one entry per converted mesh. */
  const lodObjects = [];

  /** Switch distances in world units, set by initPanorama(). */
  let lodNear = 4;
  let lodFar  = 8;

  /**
   * Build a Group with one LineSegments2 per material (mCore, mHalo),
   * both sharing the same edge positions from edgesGeo.
   *
   * @param {THREE.Object3D}    parent
   * @param {THREE.Vector3}     pos
   * @param {THREE.Euler}       rot
   * @param {THREE.Vector3}     scl
   * @param {THREE.EdgesGeometry} edgesGeo
   * @returns {THREE.Group}
   */
  function makeLineGroup(parent, pos, rot, scl, edgesGeo) {
    const group = new THREE.Group();
    group.position.copy(pos);
    group.rotation.copy(rot);
    group.scale.copy(scl);

    for (const mat of [mCore, mHalo]) {
      const geo = new LineSegmentsGeometry();
      geo.setPositions(edgesGeo.attributes.position.array);
      geo.computeBoundingSphere();   // required for frustum culling to work

      const lines = new LineSegments2(geo, mat);
      lines.renderOrder   = (mat === mCore) ? 2 : 3;
      lines.frustumCulled = true;
      group.add(lines);
    }

    parent.add(group);
    return group;
  }

  /**
   * Convert a single mesh to night-vision style:
   * replace its material and attach LOD line groups.
   *
   * @param {THREE.Mesh} mesh
   */
  function applyMesh(mesh) {
    mesh.material    = matDark;
    mesh.renderOrder = 1;

    // World-space bounding sphere center for LOD distance tests
    mesh.geometry.computeBoundingSphere();
    const center = mesh.geometry.boundingSphere.center
      .clone()
      .applyMatrix4(mesh.matrixWorld);

    // Generate edge geometry at each crease threshold
    let eFull, eCoarse, eSil;
    try { eFull   = new THREE.EdgesGeometry(mesh.geometry, 20); } catch { return; }
    if (!eFull.attributes.position.count) return;
    try { eCoarse = new THREE.EdgesGeometry(mesh.geometry, 50); } catch { eCoarse = eFull; }

    const pos = mesh.position.clone();
    const rot = mesh.rotation.clone();
    const scl = mesh.scale.clone();

    if (IS_MOBILE) {
      try { eSil = new THREE.EdgesGeometry(mesh.geometry, 70); } catch { eSil = eCoarse; }

      const full   = makeLineGroup(mesh.parent, pos, rot, scl, eFull);
      const coarse = makeLineGroup(mesh.parent, pos, rot, scl, eCoarse);
      const sil    = makeLineGroup(mesh.parent, pos, rot, scl, eSil);

      coarse.visible = false;
      sil.visible    = false;
      lodObjects.push({ full, coarse, sil, center });

    } else {
      const full   = makeLineGroup(mesh.parent, pos, rot, scl, eFull);
      const coarse = makeLineGroup(mesh.parent, pos, rot, scl, eCoarse);

      coarse.visible = false;
      lodObjects.push({ full, coarse, sil: null, center });
    }
  }

  /** Pre-allocated vector to avoid per-frame allocation in updateLOD. */
  const _camPos = new THREE.Vector3();

  /** Switch each mesh's LOD level based on current camera distance. */
  function updateLOD() {
    _camPos.copy(camera.position);

    for (const { full, coarse, sil, center } of lodObjects) {
      const d = _camPos.distanceTo(center);

      if (IS_MOBILE && sil) {
        full.visible   = d < lodNear;
        coarse.visible = d >= lodNear && d < lodFar;
        sil.visible    = d >= lodFar;
      } else {
        full.visible   = d < lodNear;
        coarse.visible = d >= lodNear;
      }
    }
  }


  /* ─────────────────────────────────────────────────────────────
     HUD  /  TYPEWRITER
  ───────────────────────────────────────────────────────────── */

  /**
   * Type `val` character by character into `valEl`.
   * `lblEl` is filled instantly. Calls `onDone` when finished.
   * Random per-character jitter makes the output feel mechanical.
   *
   * @param {HTMLElement} valEl
   * @param {HTMLElement} lblEl
   * @param {string}      lbl        Label text (instant).
   * @param {string}      val        Value text (typed).
   * @param {number}      charDelay  Base ms delay per character.
   * @param {Function}    [onDone]   Called when all characters are typed.
   */
  function typewrite(valEl, lblEl, lbl, val, charDelay, onDone) {
    lblEl.textContent = lbl;

    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cur';
    valEl.appendChild(cursor);

    function tick() {
      if (i >= val.length) {
        cursor.remove();
        onDone?.();
        return;
      }
      cursor.before(document.createTextNode(val[i++]));
      setTimeout(tick, charDelay + Math.random() * 18);
    }
    tick();
  }

  /** Sequentially type all HUD_LINES into the DOM rows. */
  function runHUD() {
    document.getElementById('hud').style.display = 'block';

    let lineIndex = 0;

    function nextLine() {
      if (lineIndex >= HUD_LINES.length) return;

      const { lbl, val } = HUD_LINES[lineIndex];
      typewrite(
        document.getElementById('val' + lineIndex),
        document.getElementById('lbl' + lineIndex),
        lbl, val, 26,
        () => setTimeout(nextLine, 60),
      );
      lineIndex++;
    }

    nextLine();
  }

  /** Replace the STATUS row (index 4) with plain text (no typewriter). */
  function setStatusLine(text) {
    document.getElementById('val4').textContent = text;
  }


  /* ─────────────────────────────────────────────────────────────
     MODEL LOADING

     Loads MODEL_PATH via GLTFLoader.
     scene.bin is resolved automatically by Three.js
     from the same directory as scene.gltf.

     The HUD typewriter and the GLTF load start simultaneously.
     Once parsed, meshes are converted one per requestAnimationFrame
     so the city materialises progressively — the chunked build-up
     is intentional and cinematic.
  ───────────────────────────────────────────────────────────── */

  function autoLoad() {
    const loader = new GLTFLoader();

    loader.load(
      MODEL_PATH,

      // onLoad
      gltf => {
        scene.add(gltf.scene);

        // Fit camera frustum and fog to the model's actual bounding box
        const box    = new THREE.Box3().setFromObject(gltf.scene);
        const center = box.getCenter(new THREE.Vector3());
        const size   = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        scene.fog = new THREE.FogExp2(COLOR_BG, IS_MOBILE ? 1.8 / maxDim : 1.2 / maxDim);

        controls.target.set(center.x, center.y * 0.3, center.z);
        camera.position.set(
          center.x + maxDim * 0.55,
          center.y + maxDim * 0.38,
          center.z + maxDim * 0.70,
        );
        camera.near = maxDim * 0.0002;
        camera.far  = maxDim * 25;
        camera.updateProjectionMatrix();
        controls.maxDistance = maxDim * 4;
        controls.update();

        // Build panorama keyframes scaled to this model's dimensions
        initPanorama(center, maxDim);

        // Place camera at keyframe 0 immediately — no jump when tour starts
        panoramaStep(0);

        // Reveal the canvas: chunked geometry will appear over the coming frames
        renderer.domElement.style.display = 'block';

        // Collect all meshes, then convert them one per animation frame
        const meshes = [];
        gltf.scene.traverse(n => { if (n.isMesh) meshes.push(n); });
        const total = meshes.length;
        let i = 0;

        function processNext() {
          if (i >= total) {
            sceneReady = true;   // unlocks the render loop camera update
            panoramaStep(0);     // re-confirm kf0 position before first tour frame
            return;
          }
          applyMesh(meshes[i++]);
          requestAnimationFrame(processNext);
        }
        requestAnimationFrame(processNext);
      },

      null,  // onProgress — not needed

      // onError
      err => console.error('[autoLoad] GLTF error:', err),
    );
  }


  /* ─────────────────────────────────────────────────────────────
     PANORAMIC CAMERA SYSTEM

     Smoothly interpolates between KF_TEMPLATES keyframes using
     a degree-5 Hermite (smootherstep) curve, looping endlessly.
     panoramaStep(t) is safe to call before sceneReady —
     it is used to pre-position the camera during loading.
  ───────────────────────────────────────────────────────────── */

  let autoPilot  = true;
  let sceneReady = false;

  const cityCenter = new THREE.Vector3();
  let   cityMaxDim = 10;
  let   keyframes  = [];

  /** Expand raw KF_TEMPLATES into world-space keyframe objects. */
  function buildKeyframes() {
    keyframes = KF_TEMPLATES.map(([deg, dM, hM, lyM, dur]) => ({
      angle:  deg * Math.PI / 180,
      dist:   dM  * cityMaxDim,
      height: hM  * cityMaxDim,
      lookY:  lyM * cityMaxDim,
      dur,
    }));
  }

  /**
   * Degree-5 smootherstep — zero first and second derivatives at t=0 and t=1.
   * Produces smoother acceleration/deceleration than the standard cubic.
   */
  function smootherstep(t) {
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  /**
   * Position the camera at tour time `t` (seconds).
   * @param {number} t  Elapsed tour time in seconds.
   */
  function panoramaStep(t) {
    if (!keyframes.length) return;

    const totalDur = keyframes.reduce((sum, k) => sum + k.dur, 0);
    const tMod     = ((t % totalDur) + totalDur) % totalDur;

    // Find the active keyframe pair
    let elapsed = 0;
    let idx     = 0;
    for (let i = 0; i < keyframes.length; i++) {
      if (tMod < elapsed + keyframes[i].dur) { idx = i; break; }
      elapsed += keyframes[i].dur;
    }

    const A = keyframes[idx];
    const B = keyframes[(idx + 1) % keyframes.length];
    const f = smootherstep((tMod - elapsed) / A.dur);

    // Linear interpolation of all camera parameters
    const angle  = A.angle  + (B.angle  - A.angle)  * f;
    const dist   = A.dist   + (B.dist   - A.dist)   * f;
    const height = A.height + (B.height - A.height) * f;
    const lookY  = A.lookY  + (B.lookY  - A.lookY)  * f;

    camera.position.set(
      cityCenter.x + Math.sin(angle) * dist,
      cityCenter.y + height,
      cityCenter.z + Math.cos(angle) * dist,
    );
    camera.lookAt(cityCenter.x, cityCenter.y + lookY, cityCenter.z);
  }

  /**
   * Initialise panorama and LOD state after the model bounding box is known.
   * @param {THREE.Vector3} center  Model world-space center.
   * @param {number}        maxDim  Largest bounding box dimension.
   */
  function initPanorama(center, maxDim) {
    cityCenter.copy(center);
    cityMaxDim = maxDim;
    buildKeyframes();

    lodNear = maxDim * (IS_MOBILE ? 0.25 : 0.35);
    lodFar  = maxDim * (IS_MOBILE ? 0.50 : 0.70);

    tourTime = 0;
  }


  /* ─────────────────────────────────────────────────────────────
     INPUT — tap / click toggles autopilot

     Pointer travel distance between pointerdown and pointerup
     distinguishes a tap (< 8 px) from a drag.
  ───────────────────────────────────────────────────────────── */

  let _pointerDown = null;

  renderer.domElement.addEventListener('pointerdown', e => {
    _pointerDown = { x: e.clientX, y: e.clientY };
  });

  renderer.domElement.addEventListener('pointerup', e => {
    if (!_pointerDown || !sceneReady) return;

    const dx = e.clientX - _pointerDown.x;
    const dy = e.clientY - _pointerDown.y;
    _pointerDown = null;

    // Ignore if pointer moved more than 8 px — it was a drag, not a tap
    if (Math.sqrt(dx * dx + dy * dy) > 8) return;

    autoPilot        = !autoPilot;
    controls.enabled = !autoPilot;
    if (!autoPilot) controls.update();

    setStatusLine(autoPilot ? 'AUTOPILOT' : 'MANUAL CONTROL');
  });


  /* ─────────────────────────────────────────────────────────────
     RENDER LOOP  —  fixed 25 fps

     tourTime only increments once sceneReady is true, so the
     camera stays frozen at keyframe 0 during chunked loading.
     This prevents any visual jump when the tour begins.
  ───────────────────────────────────────────────────────────── */

  const clock     = new THREE.Clock();
  let   tourTime  = 0;
  let   lastFrame = 0;

  function animate(now) {
    requestAnimationFrame(animate);

    // Skip frame if less than FRAME_MS ms have elapsed (25 fps cap)
    if (now - lastFrame < FRAME_MS) return;
    lastFrame = now;

    const dt = clock.getDelta();

    // Subtle sun intensity pulse — keeps the scene perceptually alive
    sun.intensity = 0.11 + Math.sin(tourTime * 0.3) * 0.01;

    if (sceneReady) {
      tourTime += dt;

      if (autoPilot && keyframes.length) {
        panoramaStep(tourTime * 0.6);   // 0.6 = global tour speed multiplier
      } else {
        controls.update();
      }

      updateLOD();
    }

    renderer.render(scene, camera);
  }

  requestAnimationFrame(animate);


  /* ─────────────────────────────────────────────────────────────
     RESIZE
  ───────────────────────────────────────────────────────────── */

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    RES.set(innerWidth, innerHeight);  // LineMaterial uses this for pixel-width lines
  });


  /* ─────────────────────────────────────────────────────────────
     BOOT  —  start HUD typewriter and model load in parallel
  ───────────────────────────────────────────────────────────── */

  runHUD();
  autoLoad();

</script>
</body>
</html>
