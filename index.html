<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manhattan — Night Vision 2037</title>
  <link rel="stylesheet" href="styles/main.css" />

  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.183.2/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.183.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="crt"></div>

  <!-- HUD left -->
  <div id="hud" class="panel">
    <div class="prow"><span class="plbl" id="lbl0"></span><span class="pval" id="val0"></span></div>
    <div class="prow"><span class="plbl" id="lbl1"></span><span class="pval" id="val1"></span></div>
    <div class="prow"><span class="plbl" id="lbl2"></span><span class="pval" id="val2"></span></div>
    <div class="prow"><span class="plbl" id="lbl3"></span><span class="pval" id="val3"></span></div>
    <div class="prow"><span class="plbl" id="lbl4"></span><span class="pval" id="val4"></span></div>
  </div>

  <!-- Target panel right — shown once, text updated each lock cycle -->
  <div id="target-panel" class="panel">
    <div class="prow"><span class="plbl">TARGET  </span><span class="pval" id="t-name">--</span></div>
    <div class="prow"><span class="plbl">SECTOR  </span><span class="pval" id="t-sector">--</span></div>
    <div class="prow"><span class="plbl">RISK    </span><span class="pval" id="t-risk">--</span></div>
    <div class="prow"><span class="plbl">THREAT  </span><span class="pval" id="t-threat">--</span></div>
    <div class="prow"><span class="plbl">UPLINK  </span><span class="pval" id="t-uplink">--</span></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
